# ==============================================================================
# QueueLess — Spring Boot & Liquibase Application Configuration
# ==============================================================================
server.port=8080
spring.application.name=queueless-backend

# H2 In-Memory Database Configuration (Zero-setup instant boot)
spring.datasource.url=jdbc:h2:mem:queuelessdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Liquibase Database Migrations Settings
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false

# CORS Configuration for TypeScript Frontend
queueless.cors.allowed-origins=*
